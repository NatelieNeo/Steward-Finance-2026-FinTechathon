# Local production-like stack: API + PostgreSQL.  docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: steward
      POSTGRES_USER: steward
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-steward-local-only}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U steward"]
      interval: 5s
      retries: 10
  api:
    build: .
    depends_on:
      db: {condition: service_healthy}
    environment:
      DATABASE_URL: postgresql+psycopg://steward:${POSTGRES_PASSWORD:-steward-local-only}@db:5432/steward
      STEWARD_ENV: ${STEWARD_ENV:-development}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      STEWARD_LLM_PROVIDER: ${STEWARD_LLM_PROVIDER:-auto}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports: ["8000:8000"]
volumes:
  pgdata:
