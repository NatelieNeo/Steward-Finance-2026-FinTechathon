[project]
name = "steward-finance"
version = "1.0.0"
description = "Steward: an AI personal-finance participant with permission tiers, bill analysis and spending insights."
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 125
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
